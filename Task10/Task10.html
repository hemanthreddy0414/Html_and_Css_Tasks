<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Forms</title>
</head>
<body>
    <h><font></font></h>
     <form>
        <fieldset>
        <lable>User Name</lable>
        <input type="text" placeholder="Enter your Name"/><br>
        <lable>Age</lable>
        <input type="number" placeholder="Enter your Age"/><br>
        <lable>DOB</lable>
        <input type="date" placeholder="dd/mm/yy"/><br>
        </fieldset>

        <filedset>
        <lable>Mobile No:</lable>
        <input type="tel" placeholder="Enter your Mobile No"/><br>
        <lable>Email</lable>
        <input type="email" placeholder="Enter your Email"/><br>
        <lable>Address</lable>
        <input type="address" placeholder="Enter your Address"/><br>
        <textarea rows="10" cols="50"></textarea>
        </fieldset>
    </form>
    <form action="success.html" method="GET">
        <lable>User Name</lable>
        <input type="text" placeholder="Enter your Name" required/><br>
        <lable>Password</lable>
        <input type="text" placeholder="Enter your Password" required/><br>
        <input type="submit" value="Login"/>
    </form>
</body>
</html>
