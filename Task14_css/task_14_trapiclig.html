<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    #background{
        text-align: center;
        background-color: aliceblue;
        height: 500px;
        width: 300px;
        margin-left: 30%;
    }
    #trafic_background{
        background-color: rgb(21, 20, 20);
        height: 300px;
        width: 150px;
        margin-top: 30px;
        margin-left: 25%;
        border-radius: 20px;
    }
    .circle{
    text-align:center ;
    margin-left: 50%;
     height: 80px;
     width: 100px;
     border: 1px solid white;
     padding: 10px;
     font-size: 8px;
     text-align: center;
     border-radius: 50%;
    }
    #stop{
        
       text-align:center;
        background-color: red;
        color: aliceblue;
       font: size 10px; 
        padding: 10px;
        border:2px solid white ;
        border-radius:50% ;
        margin: 10px;
        

    }
    #ready{
        
        text-align: center;
        background-color: rgb(245, 153, 67);
        color: aliceblue;
        font-size: 12px;
        padding: 10px;
        border: 3px solid white;
        border-radius: 50%;
        margin: 10px;

    }
    #go{
        margin-left: 25%;
        text-align: center;
        background-color: rgb(34, 94, 4);
        color: aliceblue;
        font-size: 12px;
        padding: 10px;
        border: 3px solid white;
        border-radius: 50%;
        margin: 10px;

    }
    .line{
        background-color: black;
        margin-left: 50%;
        border-radius:2px ;
        height:70px ;
        width:15px ;
    }
    h1{
        text-align: center;
        font-size: 20px;
        margin-top: 5px;
    }
    p{
        text-align: center;
        font-size: 10px;
        margin-bottom: 5px;
    }
</style>
<body>
    <div id="background">
      <div id="trafic_background">
        <p class="circle" id="stop">STOP <br> PROCRASTINATION <br>🤚</p>
        <p class="circle" id="ready">GET READY <br> TO GO <br>🤚</p>
        <p class="circle" id="go">START <br> YOUR RIDE <br>🤚</p>
      </div>
      <div class="line"></div>
      <h1>FULLSTACK EXPERTS ACADEMY</h1>
      <p>Learn • Build • Grow </p>
    </div>  
</body>
</html>
