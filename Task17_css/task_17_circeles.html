<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        height: 500px;
        width: 500px;
        border: 3px solid turquoise;
        margin: 20px;
        position: relative;
    }
    .c1{
        height: 300px;
        width: 300px;
        border-radius: 50%;
        border: 5px solid red;
        background-color: rgb(254, 254, 95);
        margin: 5px;
       position: absolute;
       top: 10px;
       left: 40%;
       
    }
    .c2{
        height: 200px;
        width: 200px;
        border-radius: 50%;
        border: 5px solid rgb(82, 73, 245);
        background-color: rgb(240, 126, 56);
        margin: 5px;
       position: absolute;
       top: 60px;
       left: 44%;
    }
    .c3{
        height: 100px;
        width: 100px;
        border-radius: 50%;
        border: 5px solid rgb(104, 239, 92);
        background-color: rgb(238, 61, 223);
        margin: 5px;
        position: absolute;
       top: 110px;
       left: 48%;
    }
    #heading{
        
        font-size: 12px;
        text-shadow: 5px 5px 3px rgb(15, 8, 208);
        color: rgb(241, 241, 5);
        position: absolute;
       top: 20px;
       left: 20%;
    }

</style>
<body style="background-color: black;">
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="c3">
        <p id="heading">FULLSTACK DEVELOPER</p>
    </div>
    
</body>
</html>
